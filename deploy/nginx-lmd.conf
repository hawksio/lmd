# /etc/nginx/sites-available/lmd  (symlink into sites-enabled).
# One block serves the base domain, every organisation subdomain (*.base) and the console host, with a wildcard
# certificate from certbot's DNS challenge. Add a copy of the 443 block per organisation custom domain, with its
# own certificate, after the platform owner registers that domain in the console.
# Add to nginx.conf (http block):  limit_req_zone $binary_remote_addr zone=lmd_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lmdglobalfinltd.com *.lmdglobalfinltd.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lmdglobalfinltd.com *.lmdglobalfinltd.com;   # includes the console host (e.g. console.lmdglobalfinltd.com)

    ssl_certificate     /etc/letsencrypt/live/lmdglobalfinltd.com/fullchain.pem;   # wildcard: -d lmdglobalfinltd.com -d '*.lmdglobalfinltd.com'
    ssl_certificate_key /etc/letsencrypt/live/lmdglobalfinltd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 12m;   # a little above LMD_MAX_UPLOAD_MB; the app enforces the real limit

    # Long-lived caching for photos served straight from disk. Everything else goes through the app so it gets
    # its security headers and organisation checks.
    location /images/ {
        alias /srv/lmd/app/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ~ ^/(account/(login|register|forgot|reset)|api/enquiries) {
        limit_req zone=lmd_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;                 # the app chooses the organisation from this
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# Hosts nginx doesn't recognise are dropped rather than passed to the app.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
